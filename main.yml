name: Astro-Quant Live Scanner

on:
  schedule:
    # Runs at 10:00 AM UTC (3:30 PM IST - Market Close) Monday to Friday
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the JSON file back to the repo

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas requests

    - name: Run Scanner Engine & Send Telegram
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python live_scanner.py
        
    - name: Commit Updated scan_results.json
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add scan_results.json
        git commit -m "Auto-update Astro-Quant Scan Data" || echo "No changes to commit"
        git push
